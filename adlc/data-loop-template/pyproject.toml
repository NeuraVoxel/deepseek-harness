[project]
name = "data-loop-platform"
version = "0.0.1"
description = "MVP scaffold for an AD data closed-loop platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["pipelines/tests"]
pythonpath = ["pipelines"]
