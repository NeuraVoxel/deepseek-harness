name: ai-eng
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Agent Note format gate (docs/testing-policy.md). Add your package's
      # smallest checks (typecheck / tests / coverage) as extra steps here.
      - run: npx --yes @neuravoxel/ai-eng verify-notes .agents/notes
